# Live evaluation against real models. Records every response under cassettes/ so that the CI job
# can replay them without a key, and pushes results to a branch `eval-runs/<run id>` for review.
# Trigger from the Actions tab ("Run workflow").
name: eval-live
on:
  workflow_dispatch:
    inputs:
      provider: {description: "openrouter (OPENROUTER_API_KEY), gemini (GEMINI_API_KEY, Google AI Studio) or github", default: gemini}
      models: {description: "space-separated model ids (empty = all in config)", default: ""}
      ablations: {description: "run ablations (true/false)", default: "true"}
permissions:
  contents: write
  models: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Check model availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p results
          if [ "${{ inputs.provider }}" = "gemini" ]; then
            curl -s -H "Authorization: Bearer $GEMINI_API_KEY" https://generativelanguage.googleapis.com/v1beta/openai/models \
              | python -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(sorted(m['id'] for m in d.get('data',[]))) or d)" > results/available_models.txt
            for m in $(python -c "import yaml; print(' '.join(x['id'] for x in yaml.safe_load(open('config/eval.gemini.yaml'))['models']))"); do
              code=$(curl -s -o probe.json -w "%{http_code}" -H "Authorization: Bearer $GEMINI_API_KEY" -H "Content-Type: application/json" \
                https://generativelanguage.googleapis.com/v1beta/openai/chat/completions -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Sag OK\"}],\"max_tokens\":20}")
              echo "PROBE $m HTTP $code $(head -c 300 probe.json | tr '\n' ' ')" | tee -a results/available_models.txt
            done
          elif [ "${{ inputs.provider }}" = "github" ]; then
            curl -s -o catalog.json -w "catalog HTTP %{http_code}\n" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" https://models.github.ai/catalog/models | tee results/available_models.txt
            head -c 400 catalog.json >> results/available_models.txt; echo >> results/available_models.txt
            curl -s -w "\ninference HTTP %{http_code}\n" -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
              https://models.github.ai/inference/chat/completions -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Sag OK"}],"max_tokens":5}' | head -c 600 >> results/available_models.txt
          else
            curl -s https://openrouter.ai/api/v1/models | python -c "
          import json,sys,yaml
          ids={m['id'] for m in json.load(sys.stdin)['data']}
          cfg=yaml.safe_load(open('config/eval.yaml'))
          for m in cfg['models']: print(('OK      ' if m['id'] in ids else 'MISSING ')+m['id'])
          " | tee results/available_models.txt
            # key/account balance (numbers only, the key itself is never printed)
            curl -s -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/key | python -c "import json,sys; d=json.load(sys.stdin).get('data',{}); print('key:', {k: d.get(k) for k in ('limit','usage','limit_remaining','is_free_tier')})" | tee -a results/available_models.txt
            curl -s -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/credits | python -c "import json,sys; d=json.load(sys.stdin); print('account:', d.get('data', d))" | tee -a results/available_models.txt
          fi
      - name: Run evaluation (record)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          CFG=config/eval.yaml; [ "${{ inputs.provider }}" = "github" ] && CFG=config/eval.github.yaml
          [ "${{ inputs.provider }}" = "gemini" ] && CFG=config/eval.gemini.yaml
          ARGS=""; [ -n "${{ inputs.models }}" ] && ARGS="--models ${{ inputs.models }}"
          [ "${{ inputs.ablations }}" = "false" ] && ARGS="$ARGS --skip-ablations"
          python evals/run_eval.py --split test --config $CFG --mode record --concurrency ${{ inputs.provider == 'gemini' && '1' || '3' }} $ARGS 2>&1 | tee results/eval.log
          python evals/report.py --split test --config $CFG 2>&1 | tail -3
      - name: Push results to a branch
        if: always()
        run: |
          git config user.name "eval-bot"; git config user.email "eval-bot@users.noreply.github.com"
          git checkout -b "eval-runs/${{ github.run_id }}"
          for p in results cassettes docs; do [ -e "$p" ] && git add -A "$p"; done
          git commit -m "Live eval run ${{ github.run_id }} (${{ inputs.provider }})" || exit 0
          git push origin "eval-runs/${{ github.run_id }}"
